amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000

map_server:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    # Jazzy publica Twist sin cabecera por defecto. Se fija explícitamente
    # para mantener el mismo tipo hasta base_driver.
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    # si el robot queda fisicamente bloqueado (choque), con los defaults
    # (0.5 m / 10 s) empuja 10 segundos contra el obstaculo antes de
    # rendirse; con esto corta a los 4 s (a 0.12 m/s normalmente recorre
    # 0.15 m en ~1.5 s, sobra margen)
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 4.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.12
      stateful: true
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # el robot da ~0.18 m/s de maxima a PWM 255 (medido); se navega
      # por debajo de eso para que el controlador tenga margen
      desired_linear_vel: 0.12
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      # frena en curvas y cerca de obstaculos (coste del costmap local)
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # Debe coincidir exactamente con ambas inflation_layer.
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_speed: 0.08
      # chequeo de colision sobre la trayectoria proyectada
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      transform_tolerance: 0.2
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 1.5

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      use_astar: true
      allow_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 6
      height: 6
      # chasis real medido desde el centro del lidar (= base_link):
      # 12 cm adelante, 15 atras, 12 por lado
      footprint: "[[0.12,0.12], [0.12,-0.12], [-0.15,-0.12], [-0.15,0.12]]"
      plugins: ["obstacle_layer","inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: lidar camera
        lidar:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.40
          # Coherente con /scan.range_min: los retornos externos cercanos se
          # usan tanto para marking como para clearing.
          obstacle_min_range: 0.02
          raytrace_min_range: 0.02
        # scan falso de la D435 (depthimage_to_laserscan): ve los
        # obstaculos bajos que quedan debajo del plano del lidar.
        # Requiere camera.launch.py corriendo; si no publica, la capa
        # simplemente no recibe datos de esta fuente.
        camera:
          topic: /camera_scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.40
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.6 cerraba pasos reales (sofa vs pata de cama): con un robot de
        # 24 cm de ancho y deriva de SLAM de unos cm, cada obstaculo puede
        # aparecer doble (mapeado + detectado) y la inflacion grande
        # convierte un paso valido en infranqueable
        inflation_radius: 0.4
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      publish_frequency: 2.0
      update_frequency: 2.0
      rolling_window: false
      width: 20
      height: 20
      # chasis real medido desde el centro del lidar (= base_link):
      # 12 cm adelante, 15 atras, 12 por lado
      footprint: "[[0.12,0.12], [0.12,-0.12], [-0.15,-0.12], [-0.15,0.12]]"
      plugins: ["static_layer","obstacle_layer","inflation_layer"]
      # capa estatica: usa el /map que publica slam_toolbox en vivo,
      # asi el planificador global conoce las paredes ya mapeadas
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: lidar camera
        lidar:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.40
          # Mismo limite validado que el costmap local y /scan.
          obstacle_min_range: 0.02
          raytrace_min_range: 0.02
        camera:
          topic: /camera_scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.40
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # bajado de 0.8 por lo mismo que el local (pasos angostos reales)
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel_safe
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    # /scan se espera a 10 Hz. Tres periodos sin datos o un fallo de TF
    # invalidan la fuente y Collision Monitor publica STOP.
    source_timeout: 0.30
    base_shift_correction: true
    stop_pub_timeout: 1.0

    # Footprint preservado: x=[-0.15, 0.12], y=[-0.12, 0.12].
    # StopZone añade 18 cm delante, 5 cm detrás y 10 cm por lateral.
    # SlowdownZone añade 38 cm delante, 15 cm detrás y 21 cm por lateral.
    polygons: ["StopZone", "SlowdownZone"]
    StopZone:
      type: polygon
      points: "[[0.30, 0.22], [0.30, -0.22], [-0.20, -0.22], [-0.20, 0.22]]"
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: "[[0.50, 0.33], [0.50, -0.33], [-0.30, -0.33], [-0.30, 0.33]]"
      action_type: limit
      min_points: 1
      linear_limit: 0.08
      angular_limit: 0.8
      visualize: true
      polygon_pub_topic: collision_monitor/slowdown_zone
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      source_timeout: 0.30
      enabled: true

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [
      "controller_server",
      "planner_server",
      "behavior_server",
      "bt_navigator",
      "waypoint_follower",
      "map_server",
      "amcl"
    ]
