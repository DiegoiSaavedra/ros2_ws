amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    scan_topic: /scan
    min_particles: 500
    max_particles: 2000

map_server:
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    # Archivo instalado por robot_base; evita las recuperaciones con movimiento.
    default_nav_to_pose_bt_xml: "/home/diego/ros2_ws2/ros2_ws/install/robot_base/share/robot_base/behavior_trees/navigate_to_pose_conservative.xml"
    # 20 -> 200 ms el 30-jul. Es el plazo que espera el arbol a que el
    # servidor de accion ACUSE RECIBO de un goal, no lo que tarda en
    # planificar: no cambia en nada como navega. Con el default de 20 ms un
    # goal murio a los 21.5 ms (bt_action_node.hpp:224-231, "Timed out while
    # waiting for action server to acknowledge goal request for
    # compute_path_to_pose") sin llegar a calcular ni una ruta, simplemente
    # porque la Pi estaba cargada en ese instante. Dando el goal a mano se
    # arregla repitiendo; en una prueba automatica de ida y vuelta no hay
    # nadie repitiendo y el ciclo se corta solo.
    default_server_timeout: 200

behavior_server:
  ros__parameters:
    use_sim_time: false
    # Jazzy publica Twist sin cabecera por defecto. Se fija explícitamente
    # para mantener el mismo tipo hasta base_driver.
    enable_stamped_cmd_vel: false
    # Los mismos cuatro que Nav2 carga por defecto; se declaran explicitos
    # para que quede a la vista cuales estan activos.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # OJO: simulate_ahead_time es parametro DE NODO, no del plugin. En
    # drive_on_heading.hpp:207-210 se declara como "simulate_ahead_time" a
    # secas, SIN el prefijo del behavior. Ponerlo bajo `backup:` no hace
    # nada: se ignora en silencio y queda el default 2.0. Estuvo mal puesto
    # desde el 28-jul, asi que ni el 0.5 de aquel dia ni el 0.05 del 29-jul
    # llegaron nunca al nodo.
    #
    # 0.05 DESACTIVA a proposito la comprobacion de colision del backup.
    # max_cycle_count = int(cycle_frequency * simulate_ahead_time) y
    # cycle_frequency vale 10 (timed_behavior.hpp:75), asi que int(0.5) = 0
    # y el bucle no corre. Hace falta porque la PRIMERA iteracion evalua la
    # pose ACTUAL (cycle_count == 0 -> desplazamiento 0, ver
    # drive_on_heading.hpp:179-191): si el footprint ya toca una celda letal
    # --justo cuando hace falta retroceder-- el backup falla en 0.6 ms sin
    # evaluar ni una pose hacia atras. Medido con el robot de morro contra
    # un mueble: coste 254 en la pose actual, letal a 0.146 m DELANTE.
    # La proteccion de esos 15 cm la da ApproachZone del Collision Monitor,
    # direccional y sobre /scan crudo.
    simulate_ahead_time: 0.05
    spin:
      plugin: "nav2_behaviors::Spin"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    backup:
      plugin: "nav2_behaviors::BackUp"
      # NO poner simulate_ahead_time aqui: es parametro de nodo y aqui se
      # ignora. Esta arriba, al nivel de behavior_server.

waypoint_follower:
  ros__parameters:
    use_sim_time: false

controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    controller_frequency: 10.0
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    # si el robot queda fisicamente bloqueado (choque), con los defaults
    # (0.5 m / 10 s) empuja 10 segundos contra el obstaculo antes de
    # rendirse; con esto corta a los 4 s (a 0.12 m/s normalmente recorre
    # 0.15 m en ~1.5 s, sobra margen)
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      # Relajado de 0.15 m / 4 s a 0.10 m / 6 s: en el paso estrecho la
      # localizacion se descuadra un momento, el robot corrige y se vuelve a
      # cuadrar solo (modo localization, el mapa fijo no se corrompe), pero
      # durante esos segundos casi no avanza y Nav2 abortaba justo antes de
      # que se recuperara. A 0.08 m/s (limite de SlowdownZone) recorrer 0.10 m
      # lleva 1.25 s, asi que quedan ~4.75 s de margen para el bache. Si el
      # robot esta realmente atascado, sigue abortando a los 6 s.
      required_movement_radius: 0.10
      required_movement_angle: 0.25
      movement_time_allowance: 6.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08
      # Subido de 0.12 a 0.30 rad (de 7 a 17 grados) el 28-jul: la base no
      # puede girar despacio. Por debajo de PWM 100 no arrancan las dos ruedas
      # en pivote, asi que el giro mas lento posible son ~0.475 rad/s, o sea
      # 2.7 grados por ciclo de control a 10 Hz. Exigir 7 grados obligaba a
      # frenar justo en dos ciclos, y el resultado era el titubeo del giro
      # final (motores sonando, sin llegar a colocarse). 17 grados es lo que
      # este hardware puede cumplir de forma repetible.
      yaw_goal_tolerance: 0.30
      stateful: true
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # el robot da ~0.18 m/s de maxima a PWM 255 (medido); se navega
      # por debajo de eso para que el controlador tenga margen
      desired_linear_vel: 0.12
      # Probado 0.20 el 29-jul creyendo que RPP recortaba la curva al entrar
      # al paso: NO cambio nada (descentrado 16.4 cm antes, 16.3 cm despues),
      # asi que se revierte a 0.3. El descentrado no viene del lookahead.
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      # frena en curvas y cerca de obstaculos (coste del costmap local)
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      # Debe coincidir exactamente con ambas inflation_layer.
      inflation_cost_scaling_factor: 3.0
      cost_scaling_dist: 0.35
      regulated_linear_scaling_min_speed: 0.08
      # chequeo de colision sobre la trayectoria proyectada
      use_collision_detection: true
      # 1.0 s daba "detected collision ahead!" en el paso estrecho sin que el
      # Collision Monitor viera nada: el footprint padded (0.26 m) deja 7 cm
      # por lado en un hueco de 0.40 m, y al proyectar un segundo entero el
      # arco (que incluye la componente angular) barre mucho mas que el propio
      # robot y toca pared. Con 0.5 s sigue mirando ~6 cm por delante, y la
      # proteccion real la dan ApproachZone y StopZone sobre /scan en crudo.
      max_allowed_time_to_collision_up_to_carrot: 0.5
      transform_tolerance: 0.2
      # Se probo en false el 29-jul (hipotesis: el pivote barria la esquina
      # trasera contra la pared). NO arreglo nada -- el fallo se repitio
      # identico -- y ademas empeoro la movilidad: sin pivote el robot se
      # arrastra para orientarse y le cuesta llegar al objetivo. Se vuelve al
      # default (true), que es lo que da buena maniobrabilidad en esta base.
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.35
      max_angular_accel: 1.5

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.125
      use_astar: true
      allow_unknown: true
      # MEDIDO el 30-jul con el robot parado donde acababa de fallar, en el
      # paso estrecho: hueco 0.500 m (cinta: 47.5), aire libre 0.040 m a la
      # IZQUIERDA y 0.240 m a la derecha, y mas de 1.2 m libres adelante. O
      # sea que el robot iba 10 cm descentrado, rozando una pared, con
      # espacio de sobra del otro lado. Con 4 cm de aire cualquier
      # proyeccion de RPP toca pared y aborta ("detected collision ahead").
      #
      # Este parametro es lo que hace que el SmacPlanner2D se aparte de las
      # zonas de coste alto. Estaba en su default 1.0, que la propia
      # documentacion describe como el ajuste "to optimize for speed" y el
      # que menos centra en pasillos ("larger values will place in the
      # center of aisles more exactly"). Para un robot de 22 cm en un paso
      # de 50 cm, centrar no es un lujo: son 14 cm de aire por lado en vez
      # de 4. Cuesta algo mas de CPU al planificar.
      #
      # 3.0 -> 5.0 el 31-jul-2026. El 3.0 mejoro mucho pero NO alcanzo: la
      # misma geometria del 30-jul volvio a repetirse (hueco 0.500 m, aire
      # 0.040 izq / 0.240 der, con mas de 1.2 m libres ADELANTE), con el
      # robot atascado y el camino despejado.
      #
      # Medicion que decidio el cambio, con holgura.py y el robot NAVEGANDO
      # dentro del tramo estrecho (hueco 0.575 m):
      #     el robot va a 0.250 m de la pared izq y 0.325 de la derecha
      #     el PLAN  va a 0.166 m de la izq      y 0.409 de la derecha
      # O sea que el robot esta MEJOR centrado que el camino que le dan: va
      # corrigiendo hacia el centro y peleando contra su propio plan. Con el
      # plan pidiendo 0.166 m y un footprint de 0.11, quedan 5 cm de aire
      # POR DISENO, y cualquier correccion hacia ese lado hace que RPP
      # aborte con "detected collision ahead".
      #
      # Esto descarta la hipotesis alternativa (que el descentrado viniera
      # del piso de madera irregular): si fuera el piso, el robot apareceria
      # desviado RESPECTO de su plan, y se ve exactamente lo contrario.
      cost_travel_multiplier: 5.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 6
      height: 6
      # MEDIDO con cinta el 29-jul desde el centro del lidar (= base_link):
      # adelante 11, atras 15, izquierda 11, derecha 11 cm. Simetrico: el
      # lidar esta bien centrado. Antes decia 0.12 a los lados y adelante,
      # 1 cm de mas por lado que en el paso estrecho (0.475 m) se come el 9%
      # de la holgura real. El radio inscrito baja de 0.12 a 0.11 (anillo de
      # inflacion mas chico) y el circunscrito de 0.192 a 0.186.
      footprint: "[[0.11,0.11], [0.11,-0.11], [-0.15,-0.11], [-0.15,0.11]]"
      # El default de Nav2 (0.01) engordaba el footprint a 0.26 m y subia el
      # radio inscrito a 0.13. En el paso de 0.40 m eso deja 0.14 m de banda
      # transitable (menos de 3 celdas de 0.05), y el planner devolvia
      # "no valid path found" en cuanto el lidar veia una pared 2 cm corrida
      # respecto al mapa. Con 0.0 la banda pasa a 0.16 m. El margen real lo
      # siguen dando la inflacion y las zonas del Collision Monitor.
      footprint_padding: 0.0
      plugins: ["obstacle_layer","inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: lidar camera
        lidar:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.40
          # Coherente con /scan.range_min: los retornos externos cercanos se
          # usan tanto para marking como para clearing.
          obstacle_min_range: 0.02
          raytrace_min_range: 0.02
        # scan falso de la D435 (depthimage_to_laserscan): ve los
        # obstaculos bajos que quedan debajo del plano del lidar.
        # Requiere camera.launch.py corriendo; si no publica, la capa
        # simplemente no recibe datos de esta fuente.
        camera:
          topic: /camera_scan
          data_type: LaserScan
          clearing: true
          marking: true
          # Agregado el 1-ago-2026 tras verlo fallar en el pasillo: el robot
          # esquivaba el obstaculo bajo de lejos y le pasaba por encima de
          # cerca. Hay una BANDA CIEGA de 0.30 m delante del parachoques:
          #   lente de la camara      0.11 m delante de base_link
          #   range_min del scan      0.30 m desde el lente
          #   -> ciega hasta          0.41 m desde base_link
          #   frente del robot en     0.11 m
          # Dentro de esa banda no lo ve la camara (por debajo de su
          # distancia minima) ni el lidar (el objeto esta por debajo de su
          # plano). Y no es que se congele: el lidar tiene clearing y sus
          # rayos pasan POR ENCIMA del objeto, asi que raytracea esa celda
          # como libre y el obstaculo DESAPARECE justo cuando el robot esta
          # a 30 cm. Nav2 replanifica recto y choca. Medido: la pasada de
          # las 19:40 choco y tardo 60.9 s contra 22.5-23.0 de las otras.
          #
          # observation_persistence hace que el buffer conserve las
          # observaciones de esta fuente y las RE-MARQUE cada ciclo aunque
          # no lleguen datos nuevos. Como el marcado corre despues del
          # clearing dentro del mismo ciclo, la marca sobrevive al raytrace
          # del lidar.
          #
          # ASIMETRICO A PROPOSITO: aca 2.0 y en el costmap global 8.0.
          # Las dos grillas hacen trabajos distintos:
          #   global -> decide RODEAR. El planificador planifica sobre ella
          #             y necesita la memoria; es la que arreglo el choque.
          #   local  -> solo hace que RPP frene (use_collision_detection).
          #             Con marcas viejas RPP rechaza comandos validos y se
          #             dispara la recuperacion.
          #
          # Medido el 1-ago con 8.0 en las DOS: el choque desaparecio (el
          # tramo del objeto paso de 60.9 s chocando a 31.0 s rodeandolo)
          # pero los tramos limpios se fueron de ~23 s a 30.8-37.5 s y uno
          # aborto, con recuperaciones en pasillo despejado. Esa es la firma
          # de los fantasmas: cada lectura de pared se acumula desplazada
          # por deriva de localizacion y ruido de profundidad, y las paredes
          # ENGORDAN. Como la recuperacion la dispara el controlador, que
          # chequea contra el costmap LOCAL, el recorte va aca.
          #
          # OJO: el 1-ago tambien se vio al costmap local acumular marcas
          # sin borrarlas (104 -> 147 celdas letales en 1 m con el robot
          # QUIETO). La persistencia empuja en la misma direccion.
          #
          # Historial de intentos, para no repetirlos:
          #   0 local / 0 global -> choca, tramo de 60.9 s
          #   3 local / 0 global -> choca igual, 61.1 s. El razonamiento de
          #     ponerlo solo en la local era FALSO: se creyo que "el local
          #     es el que usa el controlador para esquivar de cerca", pero
          #     RPP es pure pursuit y NO gira para rodear, solo sigue la
          #     ruta global y frena.
          #   8 local / 8 global -> no choca (31.0 s) pero se vuelve timido
          #
          # Se descartaron: clearing:false en la camara (no sirve, el que
          # borra es el lidar), bajar range_min (la D435 no puede medir mas
          # cerca: por debajo de ~0.28 m a resolucion maxima los campos de
          # vision de los dos sensores IR no se solapan; bajarlo a 0.20
          # recortaria la banda a 0.31 m pero no la elimina) e inclinar la
          # camara (no cambia la distancia minima).
          observation_persistence: 2.0
          max_obstacle_height: 0.40
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 0.6 cerraba pasos reales (sofa vs pata de cama): con un robot de
        # 24 cm de ancho y deriva de SLAM de unos cm, cada obstaculo puede
        # aparecer doble (mapeado + detectado) y la inflacion grande
        # convierte un paso valido en infranqueable
        inflation_radius: 0.4
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      publish_frequency: 2.0
      update_frequency: 2.0
      rolling_window: false
      width: 20
      height: 20
      # MEDIDO con cinta el 29-jul desde el centro del lidar (= base_link):
      # adelante 11, atras 15, izquierda 11, derecha 11 cm. Simetrico: el
      # lidar esta bien centrado. Antes decia 0.12 a los lados y adelante,
      # 1 cm de mas por lado que en el paso estrecho (0.475 m) se come el 9%
      # de la holgura real. El radio inscrito baja de 0.12 a 0.11 (anillo de
      # inflacion mas chico) y el circunscrito de 0.192 a 0.186.
      footprint: "[[0.11,0.11], [0.11,-0.11], [-0.15,-0.11], [-0.15,0.11]]"
      # El default de Nav2 (0.01) engordaba el footprint a 0.26 m y subia el
      # radio inscrito a 0.13. En el paso de 0.40 m eso deja 0.14 m de banda
      # transitable (menos de 3 celdas de 0.05), y el planner devolvia
      # "no valid path found" en cuanto el lidar veia una pared 2 cm corrida
      # respecto al mapa. Con 0.0 la banda pasa a 0.16 m. El margen real lo
      # siguen dando la inflacion y las zonas del Collision Monitor.
      footprint_padding: 0.0
      plugins: ["static_layer","obstacle_layer","inflation_layer"]
      # capa estatica: usa el /map que publica slam_toolbox en vivo,
      # asi el planificador global conoce las paredes ya mapeadas
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: lidar camera
        lidar:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 0.40
          # Mismo limite validado que el costmap local y /scan.
          obstacle_min_range: 0.02
          raytrace_min_range: 0.02
        camera:
          topic: /camera_scan
          data_type: LaserScan
          clearing: true
          marking: true
          # ESTE es el que gobierna si el robot rodea el obstaculo: el
          # planificador global planifica sobre este costmap y RPP se limita
          # a seguir esa ruta. Ver la explicacion completa en la fuente
          # camera del costmap local.
          observation_persistence: 8.0
          max_obstacle_height: 0.40
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # bajado de 0.8 por lo mismo que el local (pasos angostos reales)
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel_safe
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    # /scan se espera a 10 Hz. Tres periodos sin datos o un fallo de TF
    # invalidan la fuente y Collision Monitor publica STOP.
    source_timeout: 0.30
    base_shift_correction: true
    stop_pub_timeout: 1.0

    # Footprint preservado: x=[-0.15, 0.12], y=[-0.12, 0.12].
    # StopZone: añade 10 cm delante y 5 cm detrás; lateralmente queda al ras
    # del footprint padded (0.26 m de ancho). El lateral se redujo de ±0.17 a
    # ±0.13 el 28-jul-2026: con ±0.17 la zona medía 0.34 m y el paso estrecho
    # entre el tacho y la batería mide 0.40 m, o sea 3 cm de margen por lado
    # contra un error transversal medido de 5.8 cm. La zona se activaba en la
    # entrada y Nav2 abortaba con "Failed to make progress" sin que el robot
    # llegara a moverse. La protección frontal (0.22 m) queda igual, y la
    # ApproachZone sigue proyectando el footprint según la velocidad real.
    # ApproachZone proyecta el footprint publicado para intervenir solamente
    # cuando la velocidad actual conduce hacia una colisión.
    # SlowdownZone añade 38 cm delante, 15 cm detrás y 21 cm por lateral.
    polygons: ["StopZone", "ApproachZone", "SlowdownZone"]
    # DESACTIVADA el 28-jul por la noche. Motivo, con evidencia en el log:
    #   23:21:25  Robot to stop due to StopZone polygon
    #   23:21:30  Failed to make progress -> Running backup
    #   23:21:40  Exceeded time allowance ... backup failed
    # Entre esas lineas no hay ningun "continue normal operation": la StopZone
    # siguio activa durante los 10 s del backup. Es un rectangulo fijo y corta
    # TODO movimiento sin mirar la direccion, asi que bloqueaba la unica
    # maniobra que podia desatascar al robot: apartarse marcha atras. Tambien
    # frenaba con espacio de sobra en cuanto la localizacion se descuadraba un
    # poco en el paso estrecho.
    #
    # La proteccion queda en ApproachZone, que es direccional: proyecta el
    # footprint publicado segun la velocidad REAL comandada y solo interviene
    # si esa velocidad lleva a una colision. Frena al avanzar hacia un
    # obstaculo y deja retroceder para separarse, que es justo lo que hace
    # falta. Mas SlowdownZone, que sigue limitando la velocidad al acercarse.
    StopZone:
      type: polygon
      points: "[[0.22, 0.13], [0.22, -0.13], [-0.20, -0.13], [-0.20, 0.13]]"
      action_type: stop
      min_points: 1
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
      enabled: false
    ApproachZone:
      type: polygon
      action_type: approach
      # POLIGONO PROPIO, mas angosto que el footprint (31-jul-2026).
      # Antes: footprint_topic: /local_costmap/published_footprint
      #
      # El problema, medido dos veces en el pasillo (11:24 y 11:38): el robot
      # se quedaba inmovil hasta que el goal moria. La sonda registro 229
      # ordenes vetadas con cmd_vel_safe en cero, y el reparto es lo que
      # cierra el diagnostico:
      #     adelante  (vx=+0.10)  100 vetos
      #     atras     (vx=-0.10)   98 vetos
      #     PIVOTE    (w =+0.15)   30 vetos
      # Girando en el eje el robot no se traslada. Si el pivote tambien
      # queda vetado, el veto no viene de proyectar el movimiento: se
      # cumple con el robot QUIETO. Es la misma trampa del
      # simulate_ahead_time del BackUp, ahora en el Collision Monitor.
      #
      # Por que pasa: con footprint_topic la zona ES el footprint, o sea
      # borde lateral a 0.11 m del centro (verificado en
      # /local_costmap/published_footprint: 0.220 x 0.260 m, sin padding).
      # Durante los vetos la pared estuvo a 0.15 m, SIEMPRE lateral (+71 a
      # +89 grados, nunca adelante ni atras). Son 4 cm de aire, con un LD19
      # de +-2 cm de ruido y un costmap que cuantiza a 5 cm: la zona decide
      # con mas precision de la que tienen sus datos.
      #
      # DESCARTADO antes que esto: min_points 1 -> 3. Verificado activo en
      # el nodo vivo (ros2 param get) y el fallo se repitio identico, asi
      # que no eran rayos espurios sueltos. Se deja en 3 igual, no molesta.
      #
      # 0.085 = 2.5 cm menos por lado. Se mantiene el alcance adelante
      # (0.11) y atras (-0.15), que es donde ocurren las colisiones reales
      # al conducir; lo unico que se recorta es el costado, que es lo que
      # vetaba. Coste aceptado: el monitor tolera un roce lateral de hasta
      # 2.5 cm. La proteccion de fondo no cambia, RPP sigue chequeando el
      # footprint COMPLETO contra el costmap (footprintCostAtPose >= 254).
      points: "[[0.11, 0.085], [0.11, -0.085], [-0.15, -0.085], [-0.15, 0.085]]"
      time_before_collision: 1.0
      simulation_time_step: 0.05
      min_points: 3
      visualize: true
      polygon_pub_topic: collision_monitor/approach_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: "[[0.50, 0.33], [0.50, -0.33], [-0.30, -0.33], [-0.30, 0.33]]"
      action_type: limit
      min_points: 1
      linear_limit: 0.08
      angular_limit: 0.8
      visualize: true
      polygon_pub_topic: collision_monitor/slowdown_zone
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      source_timeout: 0.30
      enabled: true

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [
      "controller_server",
      "planner_server",
      "behavior_server",
      "bt_navigator",
      "waypoint_follower",
      "map_server",
      "amcl"
    ]
