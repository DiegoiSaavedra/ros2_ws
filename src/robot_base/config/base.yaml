base_driver:
  ros__parameters:
    port: "/dev/esp32"   # symlink estable (regla udev 99-esp32.rules)
    baud: 115200
    # 0.035 -> 0.034 el 31-jul-2026, MEDIDO por dos caminos que coinciden:
    # diametro libre 6.8 cm (regla) y distancia del PISO AL CENTRO DEL EJE
    # con el robot apoyado y con su peso encima, 3.4 cm. Que las dos den lo
    # mismo dice que el caucho no se aplasta de forma medible, asi que el
    # radio de rodadura efectivo es limpio.
    #
    # Se usa en UN solo lugar, base_driver.py:1048, dentro del calculo de
    # odometria: dist_per_tick = 2*pi*wheel_radius / ticks_per_revolution.
    # NO interviene en como se comanda el robot (no aparece en
    # twist_to_wheel_velocities ni en el mapeo a PWM), asi que el robot hace
    # exactamente lo mismo: solo reporta mejor lo que hizo.
    #
    # Efecto: la odometria sobreestimaba la distancia un 2.9%. Y como
    # dtheta = (dist_der - dist_izq)/base_width y las dos distancias escalan
    # con el radio, el giro reportado tambien baja 2.9%: el error que
    # quedaba tras corregir la trocha pasa de 1.26x a ~1.22x.
    #
    # PENDIENTE relacionado: ticks_per_revolution esta en 4532 pero el
    # conteo a mano del 6-jul dio ~4491 (0.9% menos). Los dos numeros se
    # multiplican en dist_per_tick, asi que conviene verificarlos juntos
    # midiendo con cinta cuanto avanza de verdad cuando la odometria dice
    # 2.00 m, en vez de por separado.
    wheel_radius: 0.034
    # 0.145 -> 0.175 el 31-jul-2026. MEDIDO CON CINTA: cara externa a cara
    # externa de las dos ruedas 0.200 m, ancho de rueda 0.025 -> trocha de
    # centro a centro 0.175. Coherente con el chasis: el borde externo de la
    # rueda queda a 0.10 m del centro y el footprint declara 0.11 de
    # semiancho, o sea las ruedas caen 1 cm adentro.
    #
    # El 0.145 estaba mal por 21%, y aparece en DOS lugares:
    #   base_driver.py:1053  dtheta = (dist_der - dist_izq) / base_width
    #   base_driver.py:907   convierte el omega de Nav2 en vel. de rueda
    # Consecuencias del valor viejo: la odometria EXAGERABA el giro un 21%,
    # y el robot giraba ~17% MENOS de lo que se le pedia. Los dos errores se
    # cancelaban parcialmente en /odom, que mostraba casi el valor
    # comandado y escondia el problema.
    #
    # Medido contra el gyro en la prueba de recta: la odometria de ruedas
    # exageraba el giro 1.52x y 1.66x. Corrigiendo la trocha queda en 1.26x
    # y 1.37x -- el resto es PATINAJE real, que ningun parametro arregla.
    #
    # OJO al re-testear: los giros pasan a ejecutarse ~21% mas rapido para
    # el mismo comando (rotate_to_heading_angular_vel 0.8 va de PWM 126 a
    # 143), asi que el pasillo hay que revalidarlo.
    base_width: 0.175
    ticks_per_revolution: 4532
    cmd_vel_timeout: 0.25
    serial_rx_timeout: 0.25
    verbose_serial: false

    # Calibracion medida el 28-jul-2026 A BATERIA (ver la curva completa en
    # safety.py). PWM = deadband + (255 - deadband) * (|v| - min) / (max - min)
    #
    # IMPORTANTE: el robot debe estar desenchufado de la fuente de pared. Con
    # el cable puesto la velocidad cae de 0.147 a 0.033 m/s porque el cable lo
    # retiene, y cualquier medicion hecha asi es basura.
    #
    # deadband 100 en avance = el punto donde arrancan LAS DOS ruedas; por
    # debajo solo responde la derecha y el robot se va de lado.
    # Un deadband por sentido: son los PWM de arranque EN FRIO medidos, muy
    # distintos entre si porque la rueda loca debe reorientarse para pivotar
    # o para invertir la marcha (ver la tabla en safety.py).
    pwm_deadband_drive: 100.0
    # 160 -> 100 el 31-jul-2026, mismo razonamiento que el pivote: 160 era el
    # PWM de ARRANQUE EN FRIO de la marcha atras (la rueda loca barre 180
    # grados para invertir), y usarlo como deadband gobierna TODO el
    # retroceso, no solo el primer instante. Ahora el arranque lo cubre el
    # golpe (wheel_breakaway_on_reverse) y el deadband solo SOSTIENE.
    # Efecto: el BackUp del BT, que pide 0.10 m/s, pasa de PWM 213 a 187, y
    # un retroceso lento de 0.05 pasa de 168 a 114 -- que antes no arrancaba
    # y ahora si, porque el golpe rompe la friccion primero.
    pwm_deadband_reverse: 100.0
    # 200 -> 100 el 30-jul-2026, al reactivar el golpe (ver wheel_breakaway_*).
    #
    # 200 era el PWM de ARRANQUE EN FRIO del pivote, medido: con 147 no
    # arranca y con 200 si. Los 80-100 anteriores venian del barrido
    # encadenado, que medía el PWM de MANTENIMIENTO. Los dos numeros estaban
    # bien; el error era usar el de arranque como deadband, porque el
    # deadband gobierna TODO el pivote y no solo el primer instante.
    #
    # Consecuencia medida el 30-jul: con deadband 200 se pidieron 0.5 rad/s y
    # la base hizo 1.39 rad/s (velocidades de rueda -0.103/+0.099 en el
    # evento 3 del breakaway). El robot no podia pivotar despacio, se pasaba
    # de largo y le costaba apuntar a un pasillo.
    #
    # Ahora el arranque lo resuelve el golpe de 226 y el deadband solo tiene
    # que SOSTENER el giro: 100 = ~0.475 rad/s segun la tabla de safety.py.
    pwm_deadband_pivot: 100.0
    min_wheel_speed: 0.040
    max_wheel_speed: 0.147
    # Motivo del apagado de PI y trim: se calibraron con la rueda izquierda
    # floja, ya ajustada. Cualquier asimetria real se vuelve a medir antes
    # de reintroducir correccion.
    wheel_speed_pi_enabled: false
    wheel_speed_pi_kp: 800.0
    wheel_speed_pi_ki: 250.0
    wheel_speed_pi_correction_limit: 35.0
    wheel_speed_pi_integral_limit: 0.10
    wheel_speed_target_scale: 0.62
    # Trim medido el 28-jul-2026 a bateria: en 1 m de recta el robot se fue
    # 30 cm a la derecha (arco de radio 1.63 m, 0.62 rad). La rueda izquierda
    # recorrio 1.051 m y la derecha 0.961 m, o sea que la derecha avanza el
    # 91.5% de la izquierda. Se frena la izquierda para igualarlas.
    # Se aplica sobre la velocidad de rueda, no sobre el PWM.
    left_feedforward_scale: 0.915
    right_feedforward_scale: 1.00
    wheel_speed_feedback_timeout: 0.15

    # GOLPE Y SOSTEN, reactivado el 30-jul-2026 solo para el pivote.
    #
    # Por que existe: el PWM de ROMPER la friccion y el de MANTENER el giro
    # son numeros muy distintos. Arranque en frio del pivote medido en 200
    # (con 147 no arranca); el barrido encadenado, que medía mantenimiento,
    # daba 80-100. Sin golpe hay que poner el deadband en el numero de
    # arranque, y entonces el robot no puede pivotar por debajo de
    # ~1.27 rad/s: gira de mas y le cuesta apuntar a un pasillo.
    # El golpe da 226 el tiempo justo para arrancar y despues suelta al PWM
    # mapeado, que sostiene el giro sin problema.
    #
    # Por que estuvo apagado: exigia 3 muestras consecutivas >0.03 m/s dentro
    # de 0.25 s, pero solo se cuenta UNA muestra por Twist recibido y Nav2
    # publica a 10 Hz (controller_frequency). En esa ventana entraban como
    # maximo 2 conteos (t=0.1 y t=0.2; el ciclo t=0 solo inicializa), asi que
    # el criterio era inalcanzable por aritmetica y cada arranque terminaba
    # en BREAKAWAY_FAILURE -> parada de seguridad. Nunca dijo nada sobre el
    # estado de los motores.
    #
    # Arreglo: 2 muestras dentro de 0.40 s. A 10 Hz eso da hasta 4 conteos
    # posibles, o sea margen de sobra. El 0.40 es SOLO la fecha limite de
    # fallo, no la duracion del golpe: en cuanto llegan las 2 confirmaciones
    # (~0.2 s) se pasa al sosten.
    wheel_breakaway_enabled: true
    wheel_breakaway_pwm: 226
    wheel_breakaway_speed: 0.03
    wheel_breakaway_samples: 2
    wheel_breakaway_timeout: 0.40
    # Un interruptor por sentido. Arranco solo en pivote el 30-jul y se
    # extendio a los tres el 31-jul: los tres tienen el mismo problema, un
    # PWM de arranque en frio muy por encima del de mantenimiento (100 / 160
    # / 200 medidos, contra ~100 de mantenimiento en los tres).
    #
    # Motivo medido para el avance: el 31-jul a las 11:14 el robot estuvo
    # 5.2 s inmovil con una orden de 0.050 m/s pasando, que mapea a PWM
    # 113/108 -- apenas por encima del deadband de 100, que es el umbral de
    # arranque EN FRIO. Se quedo en el filo y no rompio la friccion.
    #
    # Motivo para la marcha atras: el BackUp del BT tuvo que subir a
    # backup_speed 0.10 porque con 0.05 (PWM 114) el robot ni arrancaba. Con
    # el golpe la recuperacion puede ser lenta y controlada en vez de un
    # empujon.
    #
    # EL AVANCE QUEDA EN false. Se probo en true el 31-jul y se revirtio en
    # la misma sesion. Sintomas: doble tiron visible en cada arranque (la
    # firma del golpe: 226 y caida a ~113), y sobre todo el enlace con el
    # ESP32 se cayo en plena prueba -- SerialTimeoutException al escribir,
    # 3 aperturas fallidas de /dev/esp32 y reset USB automatico -- seguido
    # de watchdogs repetidos por falta de Twist y de la Pi ahogada (EKF
    # tardando 0.327 s por ciclo contra ~0.04, slam_toolbox descartando
    # scans por cola llena). La bateria estaba cargada.
    #
    # OJO, CONTRAEVIDENCIA: la primera sospecha fue el pico de corriente
    # (226 en las dos ruedas hacia el mismo lado). Es DEBIL: el golpe de
    # PIVOTE ya estaba activo en la corrida limpia de 8/8, dispara los
    # mismos 226 una vez por giro de extremo, o sea con frecuencia parecida
    # a los arranques de avance, y corrio 203 s sin caerse el enlace. Lo
    # mas probable es el problema de siempre del ESP32/USB: sintomas
    # identicos a los del 9-jul, donde la causa fue un CABLE USB malo.
    # Sigue pendiente igual asegurar/soldar el conector de motores.
    #
    # El avance era ademas la pata con evidencia mas debil: su deadband de
    # 100 ya es el umbral de arranque en frio medido. El caso que lo
    # motivaba (5.2 s inmovil a PWM 113 el 31-jul a las 11:14) ocurrio UNA
    # vez en toda la sesion. No justifica el riesgo.
    wheel_breakaway_on_pivot: true
    wheel_breakaway_on_reverse: true
    wheel_breakaway_on_drive: false
